  firstpricedate:
    sharadar: TICKERS.firstpricedate
    status: mapped
    note: "New use (FirmAge age-clock start), permaticker-level, one row per ID via ticker_meta(). Sharadar left-censors at a floor of 1997-12-31 (matches SEP's own held-history floor): per FirmAge/spec.md's measurement, 19,366 of 74,245 tickers (26%) sit at this floor and must be NaN'd (OSAP's own tempcrsptime==FirmAge censoring analogue for CRSP's 1926-07 start). Independently re-verified on a prior snapshot for a prior-snapshot probe (grcapx): dtype datetime64, null 17.9% of 74,245 rows (all-table scope); of the 60,961 non-null rows, exactly 19,366 (31.8%) sit at the 1997-12-31 floor -- the identical count the prior probe reported, confirming the floor set is stable. For the 20,985 table=='SEP' tickers, firstpricedate matches SEP's own per-ticker min(date) exactly (diff_days==0) on 100% of rows: internally consistent, point-in-time-safe as an age-clock start once the floor rows are NaN'd. CROSS-VENDOR-UPDATE STABILITY IS NOT TESTABLE from one frozen snapshot -- TICKERS carries no per-row vintage of firstpricedate itself, only a table-level lastupdated (89% of rows stamped 2018-2026, with 40% in 2026 alone from this pull), so a value could in principle be revised on a future re-pull without any way to detect the change from this snapshot's bytes alone. Flag, not a blocker: the floor-censoring handling already required by FirmAge is unaffected."
    verified_on: ""
    probed_on_prior_snapshot: "2026-09-23"
  divamt:
    sharadar: ACTIONS.value where action=='dividend'
    status: approx
    note: "New field (not previously mapped): ACTIONS action=='dividend' rows give per-share cash dividend
      amount in `value` (float64, USD/share), with `contraticker`/`contraname` always null for this action
      (used only by tickerchange/acquisition/merger rows) and `name` always non-null (issuer name). First
      date 1997-12-31 (matches ACTIONS.min_date in the manifest); rows/year rise with the universe from
      9,682 (1999) to 14,766 (2008) to 25,336 (2020) to 28,448 (2022), 555,642 dividend rows total across
      13,657 distinct tickers. Value is NEVER null on dividend rows (0.00%); exact-zero 0.002% (111/555,642,
      not a mass point). UNITS DEVIATION FROM RAW CRSP: value is on the SAME split-adjusted basis as
      SEP.close, not the raw as-declared cash amount CRSP's dsedist convention uses -- AAPL's quarterly
      dividend is flat/smoothly rising through both its 2014-06-09 (7:1) and 2020-08-31 (4:1) splits
      (0.11750 in 2014-05 and 2014-08 alike; 0.20500 in 2020-05 and 2020-08 alike) instead of jumping by
      the split ratio, and value/SEP.close on the same date gives a plausible ~0.4-0.7% quarterly yield
      throughout (value/closeunadj would be two orders of magnitude too small pre-split). NVDA's 2024-06-10
      10:1 split shows the same basis: pre-split value 0.004 = the real $0.04 raw dividend already expressed
      in post-split share count, then a genuine business-driven raise to 0.010 post-split (NVIDIA's
      announced 150% dividend increase) reads as a real step, not a split artifact. A predictor using
      crsp.divamt as a raw per-share cash amount (e.g. compared to an unadjusted price) must therefore use
      SEP.close, never closeunadj, as its price denominator, or convert via sharefactor. Matched to SEP.close
      on the same date for 45.7% of dividend rows (the rest are OTC/delisted-by-then names outside SEP
      scope); of matched rows, implied single-payment yield >100% of close on 0.018% (100 rows -- mostly
      penny-stock liquidating/special distributions, e.g. EQC 2024-12-09 $19.00 on a $1.50 close) and >20%
      on 0.11% -- a thin tail worth winsorizing, not a mass point. One extreme vendor-error outlier
      identified: TOPS (TOP SHIPS INC) 2005-2006 rows with value up to 2.268e14, clearly corrupted (likely a
      currency/units defect on a since-restructured micro-cap) -- exclude by a sanity cap (e.g. value >
      10*close) before use. Approx status: same concept (per-share cash dividend) but split-adjustment basis
      differs from CRSP's raw dsedist convention, and the field has no OSAP predictor consumer yet mapped."
    verified_on: ""
    probed_on_prior_snapshot: '2026-09-25'
