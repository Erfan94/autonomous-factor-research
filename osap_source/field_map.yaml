    note: "Top-down operating income = GP - OpEx = revenue-cor-opex (100% exact on 589k ART rows 1999-2025), before intexp/taxexp/non-operating; Sharadar description confirms. This IS Compustat oiadp; opinc+depamor is the oibdp/ebitda concept (Sharadar ebitda = ebit+depamor is bottom-up: only 53.5% within 5%, 14.4% exact). ART = TTM sum of 4 ARQ (344/354 on 8 large tickers 2015-25; misses are FY-end 10-K reclassifications at PG/GE). Reporting currency (3.5% of rows fxusd!=1; no opincusd; usd = x/fxusd), cancels in ratios to assets. Null 3-8%/yr (15.3% in 2021, SPAC cohort), exact-zero 41/620k rows (no 0.0 fill), negative 26-48%/yr (rising post-2020). opinc/assets 2024-25 p5/p50/p95 = -1.30/0.009/0.177; (opinc+depamor)/assets nonnull 90-95%/yr (81.5% 2021). 3 ART rows date<reportperiod (NGVT, SHIP, SPCB).
