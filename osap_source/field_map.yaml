  exchcd:
    sharadar: TICKERS.exchange
    status: approx
    note: "TICKERS.exchange is the CURRENT exchange only, not a point-in-time history -- same deviation
      class as siccd/sich (see that entry). A historical exchange-move path exists via ACTIONS: action
      in {exchangeto, exchangefrom} rows are paired same-ticker/same-date (contraticker always null for
      this action; contraname carries the exchange name -- 'to'/'from' rows share a date and ticker,
      one giving the destination, the other the origin). 3,895 rows each of exchangeto/exchangefrom,
      1998-01-07 to 2026-08-11 (see vocabularies_verified note below), covering 3,149 distinct SEP-scope
      tickers (15.0% of the 20,989 SEP-scope universe) with at least one recorded move. Verified 'current'
      empirically: for the LAST exchangeto row per ticker, contraname matches TICKERS.exchange on 99.3%
      of the 2,012 non-OTC destinations (a near-exact current-exchange proxy) but only 63.5% overall
      because 1,137 of the 3,149 last-moves are TO 'OTC' (typically a pre-delisting downgrade) and
      TICKERS.exchange's vocabulary holds only 11 OTC rows total -- it does not track OTC deregistration,
      it retains the last real listed exchange. A predictor needing the exchange AS OF a historical date
      (not today's) should walk ACTIONS exchangeto/exchangefrom by ticker/date instead of TICKERS.exchange."
    verified_on: ""
    probed_on_prior_snapshot: '2026-09-25'
