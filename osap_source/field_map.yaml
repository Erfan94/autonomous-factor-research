schema_version: 1
osap_ref: b4e911e69678a7424f318617a61d813f54183123
origin: 'A Compustat->SF1 concept table inherited as MAPPING KNOWLEDGE ONLY. Statuses: mapped = same
  concept, approx = nearest SF1 concept with a stated difference, unavailable = no SF1 field. A translator
  MUST confirm every field it uses against the current snapshot (data/SNAPSHOT_MANIFEST.yaml recorded_on
  or later) and add a `verified_on` date here; `probed_on_prior_snapshot` records a probe on other bytes: the mapping
  is kept, the null / unit / mass-point facts are re-measured before use. The status column is a starting
  point, not a verification.'
global_caveats:
  universe: 'OSAP is US-only on CRSP share codes 10/11, NYSE/AMEX/NASDAQ. This project is also US-only
    (NYSE/NASDAQ/NYSEMKT, Domestic Common Stock), so geography is NOT a source of difference here. Breakpoints:
    OSAP forms portfolios on NYSE breakpoints; this project screens on a NYSE size breakpoint and ranks
    within the screened universe.'
  point_in_time: SF1 as-reported dimensions (AR*) are indexed to the SEC filing date `datekey`. The harness
    uses the latest row with datekey <= signal date. This is the Compustat PIT equivalent OSAP does NOT
    have (OSAP aligns annual data to June of t+1 as a proxy for public availability).
  fiscal_alignment: OSAP aligns annual fundamentals to June of year t+1; this project uses ART (trailing
    twelve months, as reported) as of the signal date. Signals differ for off-December fiscal year-ends
    and for any flow item (TTM sum vs fiscal year).
  history: Sharadar begins 1998-01. Predictors needing long history (ShareIss5Y, grcapx3y, LRreversal,
    MomSeason*YrPlus, EquityDuration) lose their first years, and MomSeason11YrPlus effectively starts
    2010. preflight.py's data-start check says so.
  delisting: No delisting return. The Shumway proxy in config returns.delisting is applied by the harness.
    OSAP's CRSP data embeds dlret; short-side factors read stronger there.
  industry: TICKERS.siccode / sector / famaindustry are CURRENT classifications. OSAP uses Compustat sich
    (historical). Industry-adjusted predictors carry a small look-ahead through reclassified firms.
known_traps:
- id: sf1_filing_date_is_named_date
  note: In the direct Sharadar API the SF1 filing date — the point-in-time key — is the `date` column;
    the legacy Nasdaq Data Link export called it `datekey`. The harness uses `datekey` internally and
    renames on load. `calendardate` is a normalised period label, NOT an availability date; never filter
    on it for point-in-time. Verified against api.sharadar.com/v1.0/schema/fundamentals, 2026-09-14.
- id: tickers_table_scope
  note: '`tickers.table` scopes a row to a data set. The JSON API uses modern names (`stocks`, `fundamentals`);
    the BULK export uses legacy codes (`SEP`, `SF1`, `SF2`, `SF3B`, `SFP`) — verified on the 2026-09-14
    snapshot: SEP 20,966, SF1 17,838. The harness accepts both. Join on permaticker, never on ticker row
    counts.'
- id: close_is_split_adjusted
  note: SEP.close is split-adjusted; SEP.closeunadj is not. A $1 price screen or any level compared to
    a dollar threshold must use closeunadj, or a 2020 split moves a 2005 price. Ratios of close*volume
    are split-invariant. Returns use closeadj (splits + dividends). A vendor that restates every as-of onto
    today's basis would need the same care.
- id: ticker_reuse
  note: Tickers are reused and changed. The harness keys everything on permaticker via TICKERS; a ticker
    mapping to two permatickers within one table refuses to load.
- id: marketcap_units
  note: UNITS DIFFER BY TABLE. Bulk DAILY.marketcap and DAILY.ev are in MILLIONS of USD (AAPL 4,849,208.2
    on 2026-09-11); SF1 monetary fields (assets, revenue, marketcap, sharesbas) are RAW USD / raw shares.
    The JSON API's SF1 sample agreed with raw USD. config universe.daily_marketcap_scale (1e6) is applied
    once at panel build so mkt_cap_usd on the universe frame is raw USD. A factor reading DAILY.ev directly
    must scale it itself and say so. Verified 2026-09-14. MULTI-CLASS -- DAILY and SF1 carry ONE row set per
    company, on the Primary-Class ticker only (1,338 Secondary-Class SEP tickers -> 0 DAILY rows, 0 SF1 rows);
    its marketcap is the WHOLE company (sharesbas cover total x primary price x sharefactor). See crsp.mve_permco.
    Measured 2026-09-25.
- id: art_is_a_sum_for_flows_and_a_level_for_stocks
  note: ART returns trailing-twelve-month SUMS for income/cash-flow items and the latest LEVEL for balance-sheet
    items. A year-over-year DIFFERENCE of a TTM flow smears four quarters; use ARQ with an explicit FactorDef.dimension for quarterly surprises.
- id: same_day_filings
  note: Two SF1 rows can share a datekey (late filers). The data layer sorts by (datekey, reportperiod)
    so the later period wins.
- id: sf1_reporting_currency
  note: 'SF1 monetary fields are in the REPORTING currency; SF1.fxusd is the rate (usd = x/fxusd), != 1
    on ~3.5% of ART rows (foreign filers). It cancels in a ratio of two SF1 fields, but NOT in a sum
    with a USD market term (EntMult mkt_cap_usd + debt - cashneq). Such a factor gates
    `.where(fxusd == 1)`. Universe names with fxusd != 1 at the 1998-12-31 / 2010-12-31 / 2022-11-30
    probes = 0 / 1 / 1 (<=0.06%); fxusd null on 0 universe rows with a filing. Measured 2026-09-25.'
- id: sf1_currency_cross_firm_sums
  note: 'A SUM of an SF1 monetary field ACROSS firms (industry totals, Herfindahl shares, market aggregates)
    must convert every row to USD first (x/fxusd, or the *usd variant: revenueusd, netinccmnusd, equityusd,
    epsusd, cashnequsd, debtusd, ebitusd, ebitdausd). One JPY filer in a small SIC4 group otherwise owns
    the group. Per-firm SF1/USD-market ratios in files committed before 2026-09-25 rest on the measured
    immateriality (<= 0.06% of universe names); new files gate or convert. Alpha-review 2026-09-25.'
- id: sf1_share_counts_split_restated
  note: SF1.sharesbas / shareswa / eps / price are restated to TODAY's split basis on every past row (AAPL
    FY2013 sharesbas 25.19e9 vs ~0.9e9 reported). Pair them only with SEP.close / closeadj (same basis);
    closeunadj x sharesbas is wrong by the cumulative split factor (28x for AAPL 2013). Not look-ahead in a
    ratio (a common rescaling cancels). Measured 2026-09-25.
- id: sep_no_trade_days_are_rows
  note: SEP keeps no-trade days as rows with volume 0 and the price carried forward (a 0 return then a
    catch-up return), not missing rows as in CRSP. Daily signals that need trade-only returns filter
    volume > 0 and declare it. closeadj is stored to 3 decimals, so returns on back-adjusted prices < $0.50
    are coarse. Verified 2026-09-25.
- id: yoy_by_report_period
  note: Every YoY or multi-year change uses ctx.fundamentals_yoy(years=N), gated on reportperiod_lag.notna();
    lag_months=12 lands on the wrong quarter ~15% of the time. Zero-fill only field nulls inside an existing
    year-ago row. No extra SF1 lag beyond the filing date (OSAP's 6-month lag is not reproduced). Loop
    rulings 2026-09-25.
- id: unclassified_balance_sheet_block
  note: assetsc, liabilitiesc, debtc, liabilitiesnc, debtnc, investmentsc/nc are null on ~20% of rows (91%
    financials/REITs with unclassified balance sheets). Never zero-fill them. SF1.debt users gate on
    debtc.notna() to match OSAP's un-zero-filled dltt/dlc coverage. Loop rulings 2026-09-25. Exception
    ruled 2026-09-26 -- che/cheq = cashneq + investmentsc.fillna(0), where the fill means che = cashneq for
    the unclassified block, a declared understatement; see cashneq_excludes_short_term_investments.
- id: vendor_zero_fills
  note: 'Sharadar zero-fills cor, inventory, deferredrev, investmentsnc, taxexp, rnd, ppnenet, intangibles
    for non-reporters. Where OSAP does NOT zero-fill (cogs, xsga), treat 0 as missing (GP: cor==0 -> NaN);
    where a both-years-zero tie forms a mass point in a change, null the tie. Book equity = SF1.equity
    (+ taxliabilities for txditc), preferred not removed (approx). Loop rulings 2026-09-25.'
- id: sep_volume_split_restated
  note: SEP.volume is restated to TODAY's split basis (like SEP.close). close*volume (dollar volume) is
    invariant and safe; a cross-firm rank of raw SHARE volume at a past date favours later splitters
    (look-ahead). Use as-traded shares volume*close/closeunadj, or turnover against shares =
    DAILY.marketcap*1e6/SEP.close (same basis; DAILY has no sharesbas). A volume > 0 test is unaffected.
    Found by the MomVol fetcher 2026-09-25.
- id: net_not_gross_financing_flows
  note: 'SF1 ncfcommon / ncfdebt are NET flows; OSAP''s sstk/prstkc/dltis/dltr are gross. Exact for sums
    like XFIN; approximate where OSAP uses one side. ncfdebt INCLUDES the short-term/CP net change (the
    dlcch leg); ncfcommon EXCLUDES preferred issuance/redemption (Compustat sstk/prstkc include it);
    ncfdiv is predominantly common-only (preferred included only on combined-line filers) and excludes
    NCI distributions. Measured 2026-09-25 on DATA_SHA 52402f7d1f9c; see compustat dltis / sstk / dv.'
- id: da_embedded_in_cor_sgna
  note: "SF1 cor / sgna are AS REPORTED: D&A a filer places in cost of sales or SG&A stays there (INTC/MU/TXN/MCD in cor; WMT/COST in sgna); a separate income-statement D&A line lands in opex - sgna - rnd (VZ, T, HD, CMG). Compustat cogs/xsga exclude D&A (dp). SF1 has no income-statement D&A field (depamor is the cash-flow add-back). ~36% of non-financial universe-proxy rows embed >=90% of D&A, ~40% report it separately (ARY 1999-2022, lower bound). revenue - cor - sgna (OperProfRD, CBOperProf) is short by the embedded D&A for embedders only (median 3.4% of assets, ~24% of the numerator; 42-47% decile moves); GP is short by the cor part (at most the same); OPLeverage immaterial. Add-back estimator clip(depamor - max(opex - sgna - rnd, 0), 0, depamor); opinc + depamor + rnd is worse (special items). Measured 2026-09-26 on DATA_SHA 52402f7d1f9c; see compustat cogs / xsga."
- id: cashneq_excludes_short_term_investments
  note: "SF1.cashneq is cash & equivalents ONLY; Compustat che (cash AND short-term investments) = cashneq + investmentsc (exact vs the 10-K total on MSFT/GOOGL/AAPL; investmentsc == the current securities line on 8 of 10 large holders). Among non-financial universe names 35-40% hold investmentsc > 0, median 25-44% of their che; cashneq/assets vs (cashneq+investmentsc)/assets rank rho 0.91-0.96 with 37-51% of names changing decile (probes 1999/2008/2020/2022). Use cashneq + investmentsc.fillna(0) for che/cheq (approx): the fill is numerically the same as 'else cashneq', makes no mass point, and leaves the unclassified block (86-92% financials/REITs) at cashneq, an UNDERSTATEMENT that SF1 cannot repair (their securities sit in SF1.investments with loans). investmentsc ALSO holds current financing/loan receivables for vendor-financing and captive-finance filers (CSCO, F, GM, IBM, HPE, HOG), so the sum OVERSTATES che there; the ivst -> investmentsc mapping carries the same scope caveat. The nine files that read cashneq alone (Accruals, BPEBM, Cash, CashProd, ChNWC, DelCOA, EBM, EntMult, NOA) were remapped 2026-09-26, and dNoa was translated on it. Measured 2026-09-26 on DATA_SHA 52402f7d1f9c against SEC XBRL."
- id: sep_snapshot_start_stub_month
  note: "SEP starts 1997-12-31, so calendar month 1997-12 holds ONE trading day for every ticker. A factor that aggregates daily rows into calendar months (monthly volume sums, month counts, per-month std) must not count it as a month: drop it with ctx.partial_months(\"SEP\") (harness accessor, derived from the table's first date), never with a hard-coded date. The 1997-12-31 row itself is a valid price: keep it as the prior close for 1998-01 daily returns. DAILY starts 1998-12-01, so any window needing DAILY before that is empty, not partial. Ruled 2026-09-25 after alpha-review (VolMkt, VolSD, VolumeTrend)."
- id: harness_monthly_series_first_dates
  note: "Harness-built monthly series have NO field_map key; measured 2026-09-30 on DATA_SHA 198b281de1a0 (caches built by load_or_build_*; accessors read through MonthContext). TAILEX (monthly_tailex; build_tailex_monthly): 345 months 1998-01-30..2026-09-30, first month 1998-01-30 is complete (no 1997-12 row, n_blank 0), ZERO null in 1999-01..2021-12, n_days min/median 15/21, median pooled name-days 98,996/month, 35,648,798 pooled, 4.33% of clean name-days dropped for no volume; the r < -80% guard drops 640 traded name-days (522 in 1999-2021, 18 per million pooled, 218 of 276 months touched) and moves tailex by mean 0.0008 / max 0.0057 (2003-10), corr 0.9999 with the unguarded series (reproduces the predecessor figures on this DATA_SHA); 1999-2021 tailex mean 0.473, std 0.056, range 0.31-0.62, retp5 median -4.85%. A 120-month window has 72 tailex months at 2003-12 (first scorable BetaTailRisk signal), and >=72 valid stock monthly returns for 78.9% of universe members at 2003-12, 83.8% at 2008-12, 74.9% at 2020-12. PS_INNOV (monthly_ps_innov; build_ps_innov_monthly): rows 1999-01-29..2026-09-30, first non-null 2001-02-28, 25 of 276 months in 1999-2021 null, never exactly 0, mean 2.4e-6, std 2.8e-5, residual lag-1 autocorr 0.10; the 36th non-null month is 2004-01-30, so a 60-month window holds 35 valid ps months at 2003-12 and 36 at 2004-01: first scorable BetaLiquidityPS signal is 2004-01 (about 60 of 276 months unscorable), 92.6% of members have >=36 of 60 valid returns at 2003-12, 92.3% at 2004-01, 92.9% at 2008-12, 84.6% at 2020-12. FF3 (monthly_ff3; build_ff3_daily): daily 1998-12-02..2026-09-29; mkt is RAW value-weighted (not Mkt-RF; no rf held), no null, mean 0.77%/month, std 4.5% in 1999-2021; smb/hml first 1999-07-30 (June formation), 6 of 276 months null, no exact zeros. Monthly zero-return share of universe stock months 0.24-0.68%, no name with an all-zero window at the four probes."
- id: sf1_netincdis_sign_inverted
  note: "SF1.netincdis carries the OPPOSITE sign to the discontinued-operations income it describes: continuing-operations income = netinc + netincdis (NOT netinc - netincdis). Checked 2026-09-30 on DATA_SHA 198b281de1a0 against six ARY filings with known discontinued items: PFE 2013 (netinc 22,003, netincdis -10,662 Zoetis gain -> 11,341), JNJ 2023 (35,153, -21,827 Kenvue gain -> 13,326), AGN 2016 (14,973, -15,914), MRK 2021 (13,049, -704 -> 12,345), GE 2019 (-4,979, +5,335 disc. loss -> +356), GE 2018 (-22,355, +1,726 -> -20,629). netincdis non-null on 100% of ART rows with netinc present, 88.3% exact zero. Compustat ib (before extraordinary items and disc. ops, before preferred dividends) = netinc + netincdis; residual: netinc is after NCI. The ebt - taxexp identity cannot test the sign (tracks consolinc on 83% of rows)."
