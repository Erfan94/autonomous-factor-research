unrestated-looking) on 1.0% forward / 0.2% reverse, mostly IPO/merger quarters (QRVO, SYBX, OLO) where the pre-event weighted average is a different entity; the 'neither' 17% are 84% reverse splits with median k -0.51 = genuine dilution, not a missed adjustment. sharesbas moves identically on 95.8% forward / 81.4% reverse events. So a per-share series (revenue/shareswa) built from one snapshot has no split jumps; it is NOT the as-reported per-share level (pair only with SEP.close/closeadj, never closeunadj). (7) vs sharesbas: shareswa is the period weighted average, sharesbas the period-end count; pooled ARQ swa/bas p01/p05/p50/p95/p99 0.226/0.779/1.000/1.016/1.122, exactly equal on 26.4%; universe median 0.999-1.000 with p05 0.75 (1999) to 0.93 (2022) -- low tail = issuance within the quarter (IPOs, secondaries). shareswadil >= shareswa on 98.6%. (8) PIT: 10 ARQ rows date < reportperiod (8 pre-1999; NGVT 2015Q4, SPCB 2022Q4) -- the documented table-wide quirk, not disqualifying; date - reportperiod p01/p50/p99 23/44/166 days. Supersedes the 2026-09-23 prior-snapshot probe (its numbers reproduced: ARQ null 0.047%, zero 0.13%)."
