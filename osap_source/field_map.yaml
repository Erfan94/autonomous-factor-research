      shares converted to B-equivalents; cap $1.049T. sharefactor 1.0 for GOOGL/HEI/LEN/FOXA/NWSA. SF1.marketcap
      == DAILY.marketcap*1e6 on the filing date (median ratio 1.0000, max |dev| 0.11% BRK.B, 504 rows, 6 names):
      one construction in both tables. (3) DEVIATION A, listed secondary classes: OSAP sums P_i*N_i per listed
      class; Sharadar prices every share at the primary's price. Same-day secondary/primary closeunadj on 301
      near-1:1 pairs (2008/2020/2025): median |ratio-1| 3.0%, p90 15.9% (HEI.A/HEI 0.79-0.82, LEN.B/LEN 0.75 in
      2020, NWS/NWSA 1.15 in 2025, FOX/FOXA 0.92 in 2025, GOOG/GOOGL 0.997-1.007). Cap error = spread x secondary
      share weight, a few % typically. Affects ~56/33/42/31 cap-screened universe names at 1999/2008/2020/2025-06-30
      (1.5-2.0% of names, 2.4-5.4% of cap; an upper bound, the linkage picks up a few SPAC-unit / old-ticker false
      pairs). NOT the TICKERS Primary-Class count (289-440, 10-19% of names): Sharadar tags Primary when any sibling
      exists (preferred, unit, old ticker). (4) DEVIATION B, unlisted classes (Alphabet B, META B, NKE A, F B):
      sharesbas includes them (META 2025 2.514e9, NKE 1.476e9, ratio 1.0000), so Sharadar's cap EXCEEDS a CRSP
      listed-only permco sum by the unlisted fraction. Direction stated, size not measurable from these bytes.
      Tracking stocks (Liberty FWONA/LSXMA/BATRA) link to one primary; group attribution unverified. (5) OSAP keeps
      one row per permno (both classes, same company signal); this universe keeps the Primary only. Both
      deviations are small level errors on <=2% of names in a ranked ratio (Leverage lt/me, EntMult (me+debt-cash)/
      oibdp): use mkt_cap_usd as-is, no summation, no harness change."
