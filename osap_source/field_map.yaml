      (fiscal-period-end) that Compustat prcc_c/prcc_f/prccq are defined on. 50,000-row samples of
      ARQ and ARY rows matched to SEP.close: exact match (within 1%) on the FILING-date join 96.44%
      (ARQ) / 96.18% (ARY), vs only 5.04% (ARQ) / 3.79% (ARY) on the REPORTPERIOD join. Spot check
      MSFT ARQ reportperiod 2026-06-30 (filed 2026-07-29): SF1.price 390.54 == SEP.close[2026-07-29]
      390.54, while SEP.close[2026-06-30] (reportperiod) = 373.02 -- a $17.52 miss. Filing lag is
      ~30-100 days (matches the ncfo/ni filing-lag notes), so this is not a look-ahead violation
      (date >= reportperiod) but IS a different quantity than Compustat prcc_f/prccq (fiscal-period-end
      price): any predictor needing the true period-end price will be several weeks to months stale-later
      and reflects any price move + split in that gap.
      Split basis: matches SEP.close (split-adjusted-to-today, dividend-unadjusted), not closeadj or
      closeunadj -- 48,220-row ARQ sample matched on the filing date: close 99.98% exact match vs
      closeadj 55.67%, closeunadj 76.07%. Confirmed on AAPL pre-Aug-2020-split reportperiods (e.g.
      reportperiod 2020-06-27, filed 2020-07-31, before the 2020-08-28 4:1 split): SF1.price 106.26 ==
      SEP.close[2020-07-31] 106.26, while SEP.closeunadj[2020-07-31] = 425.04 -- SF1.price is already
      split-adjusted for splits occurring AFTER the filing date, matching SEP.close semantics exactly,
      not the as-traded price.
      ESCAPE for a translator needing the genuine period-end price: use the mapping''s second branch,
      SEP.close as-of (backward, most recent trading day <= reportperiod), not SF1.price -- a 20k ARQ
      sample found a SEP row this way for 95.9% of rows; as expected it does NOT match SF1.price
      (7.77% agreement), confirming SF1.price is a materially different, later quantity, not a proxy
      for period-end SEP.close under a same-day/weekend gap.
