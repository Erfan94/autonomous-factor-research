nue - cor - sgna - rnd exactly (oth == 0) holds on 22.9% of rows (1999 24.7%, 2008 22.8%, 2020 24.8%); 37.6% of D&A dollars embedded. A LOWER bound: oth is assumed to be D&A first. >=90%-embedded by sector: Consumer Defensive 54%, Basic Materials 46%, Industrials 42%, Healthcare 41%, Technology 40%, Consumer Cyclical 40%; separate-line: Utilities 82%, Energy 80%, Communication Services 70%. SF1 cannot split emb between cor and sgna (the in-cor vs in-sgna attributions above -- INTC/MU/TXN/MCD cor, WMT/COST sgna -- come from the 10-K presentation, not from any SF1 field). GP bias: Sharadar (revenue - cor)/assets is BELOW Compustat by the cor part of emb, bounded by emb/assets: median 0.013 over all rows, 0.034 (p90 0.067) on >=90%-embedded rows = ~10% of their GP; upper-bound rank rho 0.993 / 0.992 / 0.989 (1999/2008/2020) with 22-26% of names changing decile -- a tilt against capital-intensive manufacturers. See xsga for OperProfRD / CBOperProf / OPLeverage and known_trap da_embedded_in_cor_sgna. Other checks unchanged from the 2026-09-25 verification: ART = TTM sum of 4 ARQ exact (AAPL/MSFT); null 7.81% ART / 3.44% ARQ / 0.06% ARY; exact-zero 20.50% of non-null ART = vendor zero-fill (treat 0 as missing, vendor_zero_fills); US-common null 1999/2008/2020 7.19% / 3.09% / 7.83%; 2024-12-31 US-common ART p10/median/p90 $0 / $94.8M / $4.833B."
