  oibdp:
    sf1: opinc + depamor
    status: approx
    note: "REMAPPED 2026-09-25 (was sf1: ebitda with an empty note, contradicting oiadp's note that opinc+depamor -- not ebitda -- is the oibdp/bottom-up-EBITDA concept). Sharadar ebitda = ebit+depamor (100% exact, DESCRIPTIONS-confirmed, see the ebitda entry) -- a bottom-up figure including non-operating items, not Compustat oibdp (operating income before depreciation). oibdp is now DERIVED: opinc + depamor (opinc is oiadp, Compustat top-down operating income; depamor is a Sharadar CASH-FLOW-STATEMENT line per DESCRIPTIONS -- 'a component of operating cash flow ... where this item is not contained on the company financial statements and cannot otherwise be imputed the value of 0 is used' -- conceptually not the same source line as Compustat's income-statement dp, a second approx-status caveat beyond the agreement rate). Measured agreement with ebitda on THIS snapshot (620,856 ART rows with both non-null, 1999-2025): exact match 14.66%, within 1% 29.82%, within 5% 53.39% -- matches the oiadp note's 53.5%/14.4% figures. Dimension behaviour confirmed AAPL FY2023: ART derived = sum of 4 ARQ derived exactly ($130,109M == $130,109M); ARY (fiscal-year alignment) differs slightly ($125,820M), the same FY-end 10-K reclassification pattern already noted for oiadp -- TTM flow, not a level. Null: derived is null on 9.80% of 688,440 ART rows 1999-2025 (opinc or depamor missing) -- higher than opinc's own 3-8%/yr since depamor's 0-fill convention does not rescue a null when opinc itself is absent. Exact-zero of non-null derived: 0.0052% (32/620,856) -- de minimis, not a mass point, despite depamor's documented 0-fill (opinc==0 & depamor==0 simultaneously is rare). Coverage (derived non-null share of ART rows) 1999 91.4%, 2008 95.6%, 2020 88.5%. Raw-USD scale matches assets: derived/assets 2024-25 p5/p50/p95 = -1.22/0.025/0.220. 12/688,440 ART rows date<reportperiod (0.002%, same rows as opinc), not disqualifying."
    verified_on: "2026-09-30"
    verified_status: verified-with-deviation
    verified_note: "Measured 2026-09-30 on THIS snapshot (DATA_SHA 198b281de1a0; SF1 ART, reportperiod years 1998-2021, 555,319 rows). Sign: depamor is a positive expense add-back -- positive on 88.3%, exact-zero 2.83%, negative on 0.38% of rows (2,130 rows, 1,012 non-fin / 1,118 fin); so opinc + depamor is EBITDA-like (median (opinc+depamor)/assets 0.059 vs opinc/assets 0.024, depamor/revenue median 4.7%, depamor/assets p5/p50/p95 = 0.0006/0.032/0.114). Null of opinc+depamor by year: 1998 43.7% (warm-up), 1999 8.63, 2000 7.75, 2001 4.29, 2003 3.89, 2005 5.68, 2008 4.40, 2009 2.94, 2012 5.04, 2015 6.51, 2019 7.92, 2020 11.23, 2021 17.61; pooled 1999-2021 6.60% (opinc null 5.04%, depamor null 8.50% of 555,319; 8,190 rows depamor null with opinc present, 630 the reverse -- a null depamor is not 0-filled to rescue the sum). Financials vs non-financials: sum null 8.46% vs 8.70% (1998-2021), by year within about 2 pp except 2020 12.6 vs 10.8 and 2021 23.6 vs 15.5. Exact zero depamor is 8.19% of non-null for financials vs 1.59% non-financials (DESCRIPTIONS 0-when-not-imputable convention: for banks/insurers opinc+depamor is opinc, not a true EBITDA), rising to 6.7% (2020) and 8.9% (2021) overall. Exact-zero of opinc+depamor: 20 of 490,110 non-null rows 1999-2021 (23 over 1998-2021; 15 have opinc==0 and depamor==0), 0.004% -- no mass point. Share <= 0 of non-null (this is what OSAP oibdp < 0 -> NaN removes; EntMult also loses the zeros): 27.32% pooled 1999-2021 (<0 27.32%), 21.0% (2004) to 35.4% (2009), 39.2% (2020), 39.1% (2021); non-financials 31.4% vs financials 13.1%. TTM-sum check: ART opinc+depamor equals the sum of 4 ARQ within $1 on 93.64% of 452,294 pairs 1999-2021 (depamor alone 99.39% of 452,833, opinc 93.66%; 96.44% within 0.1% for the sum) -- TTM flow, not a level; AAPL ART 2025-12/2026-03/2026-06 = $152.9B/$160.0B/$168.0B, MSFT $184.8B/$192.6B/$193.8B. Agreement with SF1.ebitda (507,220 ART rows with both non-null, 1998-2021): exact within $1 15.22%, within 1% 30.90%, within 5% 54.72% (non-financials 7.1% exact / 51.4% within 5%; financials 42.6% / 66.0%). WHY ebitda is not the mapping: SF1.ebitda = ebit + depamor on 99.98% of rows and ebit = netinc + taxexp + intexp is bottom-up, so ebitda - (opinc + depamor) = ebit - opinc, the non-operating items (interest-side and other income/expense, gains, impairments below the operating line), on 99.98% of rows; ebit - opinc / assets p5/p25/p50/p75/p95 = -0.047/-0.001/0.0003/0.0085/0.060, i.e. median small but a fat two-sided tail. Compustat oibdp is operating income before D&A, before non-operating items, so opinc + depamor is the faithful concept; ebitda null 8.66%, ebitda <= 0 26.3% of non-null. Caveat (approx): depamor is a Sharadar cash-flow-statement D&A line, not Compustat income-statement dp; raw reporting currency, fxusd != 1 on 2.98%; date < reportperiod on 3 of 555,319 ART rows. Translation use: EntMult requires sum > 0 (drop <= 0, 27.3% of non-null) and gates on null (6.6%)."
    probed_on_prior_snapshot: '2026-09-25'
