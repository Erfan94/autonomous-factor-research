  Ken French factors: |-
    STALE NOTE CORRECTED 2026-09-25 -- mkt, smb, hml are ALREADY built by the harness from THIS snapshot's
    own bytes, no HARNESS_SHA move needed: build_market_daily / MonthContext.market_daily (harness/data_layer.py
    line 482, line 1579) give the raw value-weighted CRSP-like market return; build_ff3_daily / MonthContext.ff3_daily
    (line 805, line 1625) give the full FF3 mkt/smb/hml triple from an internal NYSE-breakpoint 2x3 sort on
    SF1 book equity and DAILY market cap (see the FF3 block comment at lines 593-665 and 1637-1644). Both are
    Sharadar-native reconstructions, not downloads from Ken French's library, so a factor regressing on them
    declares that as a stated deviation, not a missing input.
    rf (risk-free rate) is genuinely NOT in the snapshot: market_daily/build_market_daily returns a RAW market
    return, not an excess return (data_layer.py lines 419-423); the harness treats rf as a near-constant
    ~0-2bp/day that does not move a beta materially but does shift an intercept -- it documents this rather
    than supplying an rf series. A factor needing an actual rf value (e.g. a literal Sharpe-ratio numerator)
    still has no source here.
  FRED / BEA: same -- still not in the snapshot; unchanged.
