    verified_status: verified-with-deviation
    verified_note: "Measured 2026-09-30 on THIS snapshot (DATA_SHA 198b281de1a0, recorded_on 2026-09-30; SF1 ART/ARQ/ARY rows 688,566/681,836/186,720); supersedes any 'THIS snapshot' wording in `note`, which is from earlier pulls. Universe = harness build_universe + MonthContext.fundamentals (PIT, ART). DAILY.marketcap (USD millions) null 0.0000% of 39,848,528 rows, exact-zero 0.063%, never negative, first date 1998-12-01; universe mkt_cap_usd (x daily_marketcap_scale 1e6, raw USD) is > 0 on 100.0% of members at 1998-12 / 1999-12 / 2008 / 2020 / 2021, exact-zero 0.00%. Units: AAPL 2021-12-31 2,913,283.9 (= $2.91T), GOOGL 1,922,950.8 (= $1.92T, all classes); DAILY quantiles p10/p50/p90 in millions 1999-12-31 12.9/151.6/3,227.9 (n 7,103), 2008-12-31 8.2/192.3/4,247.2, 2020-12-31 44.4/791.2/17,847.4, 2025-12-31 14.7/704.5/21,492.0 (none null); universe 2021-12-31 mkt_cap_usd p10/p50/p90 = $1.15B/$4.52B/$41.4B. SF1.marketcap == DAILY.marketcap*1e6 on the filing date: ratio min/median/max 1.0000/1.0000/1.0000 (AAPL, GOOGL, 23 quarters each since 2021) and 0.9997/0.9999/1.0011 (BRK.B). Coverage of DAILY rows is 100% at 1999/2008/2020. AM median at 2021-12-31 (assets/mkt_cap_usd) = 0.686. Translation: use ctx.universe['mkt_cap_usd'] as-is; guard > 0 anyway. Secondary-class pricing and unlisted-class deviations inherited from 2026-09-25 (not re-measured)."
