# Every OSAP predictor (SignalDoc Cat.Signal == Predictor, ref b4e911e6) that is
# NOT tested, with the measured reason. records.py frontier reads `excluded`.
# Rule for a missing Compustat item (field_map_index, osap-fetcher): infeasible
# unless OSAP itself zero-fills it (zero_fill_vars in CompustatAnnual.py, or the
# predictor's own fillna(0)); then the term is dropped and the row is `approx`.
schema_version: 1
excluded:
  AOP:
    reason: "requires IBES analyst forecasts (feps1, feps2, LTG); no Sharadar table carries estimates; the source drops firms without forecasts (no zero-fill)"
    class: data_unavailable
    spec: osap_source/cache/b4e911e6/AOP/spec.md
    date: "2026-09-30"
  AbnormalAccruals:
    reason: "needs compustat.ppegt (gross PP&E) as a Jones-model regressor; SF1 has only ppnenet; OSAP does not zero-fill ppegt, so the rule makes it infeasible (net-for-gross substitution not adopted)"
