    spec: osap_source/cache/b4e911e6/AbnormalAccruals/spec.md
    date: "2026-09-30"
  AccrualsBM:
    reason: "needs compustat.txp (income taxes payable); no SF1 column (112 checked; taxliabilities is total tax liabilities); AccrualsBM uses raw txp and txp is not in OSAP zero_fill_vars, so the rule makes it infeasible"
