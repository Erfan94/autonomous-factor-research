    spec: osap_source/cache/b4e911e6/AgeIPO/spec.md
    date: "2026-09-30"
  AnalystRevision:
    reason: "only input is IBES consensus meanest (fpi 1); no Sharadar table carries estimates; not a Compustat item, no zero-fill"
    class: data_unavailable
    spec: osap_source/cache/b4e911e6/AnalystRevision/spec.md
    date: "2026-09-30"
  AnalystValue:
    reason: "requires IBES analyst forecasts (feps1, feps2, LTG); no Sharadar table carries estimates; the source drops firms without forecasts (no zero-fill)"
    class: data_unavailable
    spec: osap_source/cache/b4e911e6/AnalystValue/spec.md
    date: "2026-09-30"
  BrandInvest:
    reason: "needs compustat.xad (advertising) for BrandCapital; no SF1 column; xad is not in OSAP zero_fill_vars and BrandCapital is NaN where xad is NaN (xad0 zero-fill does not reach the denominator)"
