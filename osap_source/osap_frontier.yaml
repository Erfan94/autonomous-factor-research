    spec: osap_source/cache/b4e911e6/AccrualsBM/spec.md
    date: "2026-09-30"
  Activism1:
    reason: "GIM governance index G (external spreadsheet, ends 2007-01, no Sharadar source) and 13F maxinstown_perc (SF3 from 2013-06-30): supports disjoint, zero scoreable months"
