# =============================================================================
# Phase E — the institutional construction layer (docs/CONSTRUCTION.md r2, D15)
# =============================================================================
# Carried as the predecessor's design; re-frozen at Phase E BEFORE the first construction-layer number. It judges
# nothing: no leg is added, dropped or reweighted by any number this file
# produces. It is deliberately outside CONFIG_SHA (config/test_config.yaml
# pre-registers how a factor is judged). Every layer block stamps this file's
# hash as LAYER_SHA. Editing it after the first LAYER run is logged as a
# process_finding, and the prior blocks stay as they are.
# =============================================================================

schema_version: 1

composite:
  # Pinned at Phase E to the FINISHED composite (its COMPOSITE_SHA); the layer
  # refuses any other. The placeholder matches no composite, so no layer run can
  # start before the pin is set. Setting it is part of the Phase E declaration.
  version: none
  composite_sha: "unpinned-until-phase-E"   # no composite hashes to this; Phase E replaces it

window:
  book_start: "2001-01"              # 24 months of factor returns (1999-01..2000-12) first
  reference_rows_start: "2001-01"    # every reference row is re-reported over the same months

alpha:
  form: "z_times_sigma"              # alpha_i = z_i * sigma_i; z = normal score of COMPOSITE_SCORE
  ic_lookback_months: 36             # trailing composite rank IC, months s <= t-1
  ic_min_months: 12
  ic_ref: 0.02                       # gross budget G_t = gross_cap * clip(IC_t / ic_ref, 0, 1)
  gross_cap: 2.0                     # 100% long + 100% short at full confidence; ex-ante vol is REPORTED, not targeted
  # 2026-09-27 amendment, before any real layer number: r2's 10% ex-ante vol target was
  # unreachable at gross 2 (the synthetic 2000-name panel, sigma ~9%/mo, needed a gross of
  # ~10x, median 10.1), so the cap bound in 100% of months and the confidence scaling was
  # inert. Confidence now scales the gross (process_finding layer_sizing_gross_budget; D15 note).

risk_model:
  sector_groups: "sharadar_sector_plus_unclassified"   # 12 groups; they span the market, no intercept
  style_factors: ["size_log_mktcap", "trailing_vol_12m"]
  trailing_vol_months: 12
  trailing_vol_min_obs: 6
  regression_weights: "sqrt_mktcap"
  factor_cov_halflife_months: 24
  factor_cov_window_months: 60
  factor_cov_min_months: 24
  specific_halflife_months: 24
  specific_shrink_to_sector_median: 0.5
  specific_min_obs: 12

optimiser:
  constraints: "sector_neutral"      # S'w = 0 over the 12 groups (implies dollar neutral)
  name_cap_floor: 0.01               # |w_i| <= max(name_cap_floor, name_cap_mult / N_side)
  name_cap_mult: 5.0
  cap_tol: 1.0e-10
  cap_max_iter: 50
  buffer_rel: 0.25                   # no trade while |w*_i - w_held_i| <= buffer_rel*|w*_i| + buffer_abs
  buffer_abs: 0.0002                 # 2 bp of capital
  buffer_step: 0.5                   # otherwise move this fraction toward target
  participation_pct: 5.0             # |dw_i| * AUM <= participation_pct% * adv_usd_i * participation_days
  participation_days: 21

costs:
  half_spread: "corwin_schultz_half"  # f_bidaskspreadflip / 2, per name per month, as of the signal date
  half_spread_floor_bp: 1.0
  half_spread_missing: "tier_month_median"
  impact_eta: 0.5                    # c = hs + eta * sigma_daily * sqrt(Q / ADV)
  borrow_bp_per_year: 25.0
  delisting: "shumway_close_no_cost"
  sensitivity:
    impact_eta: [0.25, 1.0]
    fixed_half_spread_bp: {MEGA: 2.0, MID: 5.0, SMALL: 12.0}   # labelled: understates 1999-2007
    # 2026-09-27 additions, before any real layer number (alpha-review of bd5c486):
    # base execution = trades at the signal-date close (as Stages 1-3); row layer_exec_half_month
    # lets the traded dw earn only this fraction of monthly_ret(t): book return sum (h + f*dw) r
    trade_return_fraction: 0.5
    # row layer_tiered_borrow: borrow by liq_tier, any other tier at the largest rate
    borrow_bp_per_year_by_tier: {MEGA: 25.0, MID: 75.0, SMALL: 200.0}

report:
  aum_usd: [1.0e8, 1.0e9, 5.0e9]
  reference_rows: ["equal_rank_decile", "buffered", "layer_no_buffer", "layer_dollar_neutral_only"]
  # ex_years is EMPTY until Phase E: it is then set by the date-free rule in
  # config/test_config.yaml `diagnostics` (the finished composite's top-k
  # long-short years in the decision window), never by hand and never from a
  # year learned on another project's window. The second cut is a fixed
  # mid-window decade, declared here before any number.
  regime_cuts: {ex_years: [], window_2011_2020: [2011, 2020]}
  bias_stat_window_months: 12
  # 2026-09-27 additions, before any real layer number (alpha-review of bd5c486); reported, never a gate:
  #   new_positions_delisting: names opened/increased (|w| > |h|) in a month whose ret_kind is
  #     partial_delisted_*, their count and their contribution to the annualised gross return
  #   sector_leak: Unclassified share of universe name-months (overall, min/max year) and the
  #     partial_delisted share inside vs outside Unclassified (TICKERS.sector is CURRENT)
  diagnostics: ["new_positions_delisting", "sector_leak"]
