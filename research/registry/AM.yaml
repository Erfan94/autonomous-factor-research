character: >
  Deciles rise almost monotonically (D1 0.818 to D10 1.211 %/mo) and the raw D10-D1 earns 4.72%/yr (Sharpe 0.216), but the rank IC is weak (0.0098, NW t 1.26) and nearly vanishes in the second half (0.0168 then 0.0028); annual IC swings from -0.071 (2007) to +0.079 (2021). SMALL carries the most (IC 0.0124) and MEGA the least (0.0040). IC at lags 1-12 is flat around 0.006-0.007; turnover 12.5% / 13.4% a month. Raw beta 0.34 (ex ante 0.25): the hedged series loses 7.9 pp/yr to 3.17%/yr (Sharpe -0.149, MaxDD -80.1%), more than 0.25 times a normal market premium, so the ex-ante beta's timing costs return. Ex-top-years Sharpe -0.449 (2003, 2009, 2021); bear 0.267 / bull -0.236.
caveats:
  - "ic_mean misses 0.010 by 0.0002, but NW t 1.26 is far from 2.5; not a near miss on significance"
  - "hedged minus raw return -7.9 pp/yr at beta 0.25: the ex-ante hedge's timing, not the mean beta, drives most of the gap"
  - "a value-family relative of v0 Value (book-to-market); its overlap would only be measured at Stage 2, which it does not reach"
decision: >
  Rejected at Stage 1 on ic_tstat_nw (1.26 < 2.5); ic_mean also fails (0.0098 < 0.010). Halves, raw spread, coverage (99.6%), names (195.7) and LS months (276) pass. Not inconclusive: the sample is full. Reads against v0: the blend's own IC is 0.0145 / t 2.62 with a second half of 0.0016, and this assets-based value signal shows the same fading second half.
