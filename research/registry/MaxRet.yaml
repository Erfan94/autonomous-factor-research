decision: >
  Passes every Stage 1 bar: IC 0.0233 >= 0.010, NW t 3.42 >= 2.5, halves min 0.0178, raw spread 4.17%/yr > 0, coverage 99.8% >= 40, 196.1 names per decile, 276 LS months >= 248. Status stage2_pending; family to be assigned in Phase C. Among the six passers its IC is second (IdioVolAHT 0.0238, IdioVol3F 0.0229) and its NW t third (CBOperProf 3.74, GP 3.52); its ex-top-years Sharpe (0.544) is the highest of the three volatility passers (IdioVol3F 0.374); v0 halves 0.0275 / 0.0016. Stage 2 (run 023, rung 3, vs v5 + GP): PASS on both bars, residual IC 0.0179 with NW t 4.01 > 2.0 (77% of its own 0.0233) and guard paired hedged dLS +2.23 pp/yr, t 1.75 >= -2.0 (raw -0.59, approximate t -0.46). Opens volatility (7 families) at 0.143. Diagnostics (never bars): dIC +0.0063 (t 2.61, the largest of ladders 1-2), spanning alpha 4.85%/yr (t 1.38, R2 0.13, corr 0.36), dSharpe +0.026 (0.925 -> 0.951), hedged MaxDD 7.7 pts better (-49.4 -> -41.7); WITH beta -0.649 vs -0.323 (ex ante -0.587 / -0.277), raw Sharpe 0.622 / 0.843, ex-top-years 0.623 / 0.490, bear / bull 0.974 / 1.045 vs 1.269 / 0.842. The rules decide on the residual IC and the hedged guard, and both pass. Accepted as v7 (factors/accepted/MaxRet.py, COMPOSITE_SHA 43c92213ae73) under decisions ladder2_acceptance and hedge_guard_negative_beta_property (the guard is near non-binding for a new negative-beta family; residual IC is the operative gate); run 026 baseline reproduces the rung 3 WITH arm to six places (16 of 16 stats); Stage 3 run 027; tag v7-add-MaxRet owed.
