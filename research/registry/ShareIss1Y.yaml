  Passes every Stage 1 bar: IC 0.0165 >= 0.010, NW t 3.52 >= 2.5, halves min 0.0142, raw spread 7.12%/yr > 0, coverage 90.5% >= 40, 181.7 names per decile, 270 LS months >= 243. Status stage2_pending; family to be assigned in Phase C. Fifth NW t of the 16 passers (GP 3.52 by 0.004); raw Sharpe 0.605 against NetEquityFinance's 0.321; ex-top-years Sharpe 0.742 third of the passers (GP 0.921, ShareIss5Y 0.749). Stage 2 (run 023, rung 2, vs v5 + GP): REJECTED on resid_ic_tstat_nw 1.88, not > 2.0 (residual IC 0.0044, 270 months); the guard passes (paired hedged dLS +0.07 pp/yr, t 0.17; raw +0.04). It would have been the third external_financing leg at 0.0556. Diagnostics (never bars): dIC +0.0006 (t 1.76), spanning alpha 3.95%/yr (t 2.61), dSharpe -0.026 (0.925 -> 0.900), MaxDD 2.0 pts worse (-49.4 -> -51.4); WITH beta -0.328 vs -0.323, raw Sharpe 0.818 / 0.843, ex-top-years 0.480 / 0.490. The rules decide on the residual IC. The file stays in factors/candidates/, and the leg is absent from the bases of rungs 3-5.
