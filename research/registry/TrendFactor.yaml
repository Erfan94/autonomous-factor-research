decision: >
  Passes every Stage 1 bar: IC 0.0171 >= 0.010, NW t 2.79 >= 2.5, halves min 0.0053, raw spread 10.12%/yr > 0, coverage 68.7% >= 40, 163.4 names per decile, 228 LS months >= 205. Not inconclusive: 228 months >= 120 and the floor. Status stage2_pending; family to be assigned in Phase C. Fourteenth NW t of the 16 passers; the highest raw spread of the passers (10.12%/yr; GP 8.64) and the third raw Sharpe (0.612; PctAcc 0.762, GP 0.688), with 2009 behind half the hedged sum; v0's halves are front-loaded too (0.0275 / 0.0016). Stage 2 (run 037, rung 5, vs v11 + zerotrade6M + VolumeTrend): PASS on both bars, residual IC 0.0078 with NW t 2.140869 > 2.0 (46% of its own 0.0171, 228 months) and guard paired hedged dLS -0.004 pp/yr, t -0.005 >= -2.0 (raw +0.77, approximate t 1.06). Second momentum leg, with Momentum, at 0.0556 each. Diagnostics (never bars): dIC +0.0017 (t 1.36), spanning alpha 10.44%/yr (t 1.77, R2 0.01, corr -0.10), dSharpe +0.004 (0.979 -> 0.983), MaxDD 1.6 pts worse (-41.6 -> -43.2); WITH beta -0.560 vs -0.619 (ex ante -0.544 / -0.589), raw Sharpe 0.773 / 0.719, ex-top-years 0.650 / 0.635. The rules decide on the residual IC and the guard, and both pass. Status stays stage2_pending; application (v14, base v13) pending the coordinator's advisor call.
