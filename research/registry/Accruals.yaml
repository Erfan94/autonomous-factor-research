character: >
  Weak everywhere: IC 0.0048 (NW t 1.84), halves 0.0075 then 0.0021, annual IC within +-0.03. Deciles are humped rather than monotone: D1 (high accruals) is the worst at 0.814 %/mo, D9 the best at 1.215 and D10 falls back to 1.057, so the raw spread (2.92%/yr, Sharpe 0.402) is mostly the D1 short. SMALL IC 0.0066, MID 0.0015, MEGA 0.0046. IC at lag 1 is -0.0001 and at lag 12 0.0024: no persistent signal. Turnover 19.1% / 19.5%. Beta near zero (0.04 full window), so the hedge barely moves it (2.49%/yr, Sharpe 0.329). Ex-top-years Sharpe 0.107 (1999, 2002, 2005 carry 72% of the summed LS); bear 0.581 / bull 0.075.
caveats:
  - "the working-capital accruals are built from ART year-over-year level changes, the analogue of the annual difference (translation docstring)"
  - "72% of the summed LS return sits in the three best years; the ex-top-years Sharpe is 0.107"
decision: >
  Rejected at Stage 1 on ic_tstat_nw (1.84 < 2.5); ic_mean also fails (0.0048 < 0.010). Every other bar passes (coverage 76.7%, 150.6 names per decile, 276 LS months). Not inconclusive. No prior Stage 1 rows exist; v0 carries no accruals leg.
