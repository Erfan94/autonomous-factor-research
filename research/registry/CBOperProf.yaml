character: >
  The spread is a short-leg effect: D1 earns 0.545 %/mo against 0.896-1.273 for D2-D10, the top is flat (D6-D10 at 1.124-1.273) and D10 (1.148) sits below D7 (1.273), so it identifies cash-unprofitable firms to avoid rather than grading the winners. Raw spread 7.24%/yr (Sharpe 0.479, MaxDD -55.5%). IC 0.0209 (NW t 3.74) is uniform across tiers (MEGA 0.0252, MID 0.0203, SMALL 0.0210): not a small-cap effect. Halves 0.0290 then 0.0127; the second half leans on 2021 (+0.094). IC decays slowly (lag 1 0.0174, lag 12 0.0147); turnover 10.0% / 15.6%. Beta -0.57 (ex ante -0.48): the hedge adds 4.0 pp/yr, to 11.24%/yr and Sharpe 0.901 (MaxDD -37.2%). The three best years (2000 at +92.5%, 2002, 2021) carry 54% of the summed LS; ex-top-years Sharpe 0.638; bear 0.614 / bull 0.999. Performance delistings are 21 rows in the whole universe (0.00%), merger delistings 0.43%.
caveats:
  - "hedged Sharpe 0.901 is nearly double the raw 0.479: at beta -0.57 the hedge adds the market premium; the factor's own strength is the raw series"
  - "Financials and Real Estate are nearly absent (coverage 3.4% / 1.8%) by OSAP's SIC 6000-6999 exclusion, read from TODAY's SIC (disclosed look-ahead, as in D3)"
  - "early coverage is thin (37.7% at the 1998-12 probe; 27-month lookback against the 1997-12 panel start); the block carries no coverage-by-year table, so 1999-2000 coverage cannot be confirmed, and 2000 is the largest LS year (+92.5%)"
  - "second-half IC 0.0127 is about half the first half's 0.0290, and the 2021 IC (+0.094) carries much of it: the 2011-2020 annual ICs average about 0.006"
  - "approx translation: xpp and xacc terms dropped (OSAP zero-fills them); cor embeds D&A for about 36% of rows (spec)"
  - "delisting_adjusted_pct 0.44% is the universe-wide forward-return mix, identical on all 12 blocks, not this factor's short leg"
  - "Stage 2 (run 012): composite IC unchanged (dIC -0.0000, paired t -0.01) while hedged Sharpe +0.047 and MaxDD 4.2 pts better; residual share 50%"
  - "Stage 2: Financials / Real Estate coverage 3.4% / 1.8% takes all-legs coverage 91.4% -> 72.7%; there the profitability family is Profitability alone"
decision: >
  Stage 1 (run 003): passes every bar (IC 0.0209, NW t 3.74, halves min 0.0127, raw spread 7.24%/yr, coverage 73.4%, 144.3 names per decile, 276 LS months). Stage 2 (run 012, rung 2, vs v0 + PctAcc): PASS on both bars, residual IC 0.0104 with NW t 3.02 > 2.0 (50% of its own 0.0209) and guard paired hedged dLS +0.44 pp/yr, t 0.95 (raw +0.31, approximate t 0.67 on the hedged paired SE). Joins profitability beside Profitability at 0.10. Diagnostics: dIC -0.0000 (t -0.01), spanning alpha 9.76%/yr (t 3.71, R2 0.04, corr 0.19), dSharpe +0.047, MaxDD 4.2 pts better; WITH beta -0.122 vs -0.121 (ex ante -0.063 / -0.074), raw Sharpe 0.777 / 0.737, ex-top-years 0.249 / 0.202. Status stays stage2_pending pending application (v2).
