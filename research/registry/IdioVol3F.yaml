character: >
  The spread is a D1 effect: D1 (highest residual volatility) 0.691 %/mo, D2-D10 flat at 0.92-1.04; raw spread 3.28%/yr at vol 23.8% (Sharpe 0.138, MaxDD -68.8%). IC 0.0229 (NW t 3.15, ICIR 0.190) is level across halves (0.0221 / 0.0237); tiers MEGA 0.0177, MID 0.0249, SMALL 0.0237 (raw LS Sharpe 0.079 / 0.171 / 0.095; MEGA raw MaxDD -87.0%). IC decays slowly (0.0204 h1, 0.0170 h6, 0.0162 h12) though the one-month measure turns over 64.0% / 69.2%. Beta -0.98 (ex ante -0.92): the hedge adds 6.82 pp, 68% of the hedged 10.10%/yr (Sharpe 0.536, LS NW t 2.61). Ex-top-years Sharpe 0.374 (2000, 2007, 2021); bear -0.212 / bull 0.946; hedged LS -23.1% (1999), -24.6% (2009), -23.5% (2020), +51.4% (2000). Coverage 96.7%, 95.1-97.9% by sector.
caveats:
  - "the hedged headline is mostly hedge: raw 3.28%/yr (Sharpe 0.138) vs hedged 10.10%/yr (Sharpe 0.536) at beta -0.98; not a Stage 1 bar (D11)"
  - "269 of 276 months: smb / hml (harness FF3 rebuild) start June 1999, so signals before 1999-07-30 are NaN; the halves and the ls_n_months floor (242) run on the block's own 269 months; the 1998-12 preflight probe reads 0% coverage / 0 bins for the same reason"
  - "approx translation: harness-built FF3 daily factors (not Ken French's), rf omitted, SEP closeadj returns with carried no-trade rows counted, at least 15 days"
  - "near-duplicate of IdioVolAHT: same construct (residual daily volatility), same D1-driven shape, beta about -1, shared top years 2000 / 2021, annual IC of the same sign in 20 of 23 years (the other three |IC| <= 0.005); differs in window (one month vs 252 days) and turnover (64% vs 11%); overlap not measured at Stage 1"
  - "Cat.Economic volatility: no v0 seed family covers it; no Stage 2 number exists"
  - "delisting_adjusted_pct 0.44% is universe-wide (performance delistings 0.00%)"
  - "Stage 2 (run 032, rung 2, vs v9): residual NW t 2.030731 clears the strict > 2.0 bar by 0.031, the thinnest margin of ladders 1-3 (RoE 2.41 next); residual IC 0.0065 on 269 months (FF3 start 1999-07), 28% of its own 0.0229; faced MaxRet (Stage 1 annual IC corr 0.94, 20 / 23 same sign)"
  - "Stage 2 diagnostics: dSharpe -0.012, hedged MaxDD 2.1 pts worse, raw Sharpe flat (0.5790 -> 0.5785), ex-top-years 0.581 -> 0.575, bear 0.934 -> 0.842 / bull 1.070 -> 1.093, raw tier Sharpe down in MEGA / MID / SMALL; spanning alpha -2.87%/yr (t -0.85, R2 0.51, corr 0.72); dIC +0.0003 (t 0.81)"
  - "Stage 2: raw dLS +0.41 and hedged +0.38 pp/yr agree in sign (approx raw t 0.95); hedge part -0.03 at dbeta_mean -0.018, too small to read a market mean; composite turnover D10 44.3 -> 39.8%, D1 39.6 -> 35.4% as MaxRet's weight halves to 0.0714"
decision: >
  Passes every Stage 1 bar: IC 0.0229 >= 0.010, NW t 3.15 >= 2.5, halves min 0.0221, raw spread 3.28%/yr > 0, coverage 96.7% >= 40, 195.0 names per decile, 269 LS months >= 242. Status stage2_pending; family to be assigned in Phase C. Second-highest mean IC of the five passers (IdioVolAHT 0.0238; CBOperProf 0.0209, CF 0.0201) the first passer whose second-half IC is at or above its first (IdioVolAHT 0.0249 / 0.0226; v0 0.0275 / 0.0016); its raw Sharpe (0.138) is the lowest of the five passers (CF 0.201). Stage 2 (run 032, rung 2, vs v9): PASS on both bars, residual IC 0.0065 with NW t 2.030731 > 2.0 (28% of its own 0.0229, 269 months) and guard paired hedged dLS +0.38 pp/yr, t 0.89 >= -2.0 (raw +0.41, approximate t 0.95). Second volatility leg, with MaxRet, at 0.0714 each. Diagnostics (never bars): dIC +0.0003 (t 0.81), spanning alpha -2.87%/yr (t -0.85, R2 0.51, corr 0.72), dSharpe -0.012 (0.932 -> 0.919), MaxDD 2.1 pts worse (-43.7 -> -45.8); WITH beta -0.752 vs -0.734 (ex ante -0.680 / -0.663), raw Sharpe 0.578 / 0.579, ex-top-years 0.575 / 0.581. Status stays stage2_pending; acceptance and application (v10) pending the coordinator's advisor call.
