character: >
  The spread is a D1 effect: D1 (highest residual volatility) 0.691 %/mo, D2-D10 flat at 0.92-1.04; raw spread 3.28%/yr at vol 23.8% (Sharpe 0.138, MaxDD -68.8%). IC 0.0229 (NW t 3.15, ICIR 0.190) is level across halves (0.0221 / 0.0237); tiers MEGA 0.0177, MID 0.0249, SMALL 0.0237 (raw LS Sharpe 0.079 / 0.171 / 0.095; MEGA raw MaxDD -87.0%). IC decays slowly (0.0204 h1, 0.0170 h6, 0.0162 h12) though the one-month measure turns over 64.0% / 69.2%. Beta -0.98 (ex ante -0.92): the hedge adds 6.82 pp, 68% of the hedged 10.10%/yr (Sharpe 0.536, LS NW t 2.61). Ex-top-years Sharpe 0.374 (2000, 2007, 2021); bear -0.212 / bull 0.946; hedged LS -23.1% (1999), -24.6% (2009), -23.5% (2020), +51.4% (2000). Coverage 96.7%, 95.1-97.9% by sector.
caveats:
  - "the hedged headline is mostly hedge: raw 3.28%/yr (Sharpe 0.138) vs hedged 10.10%/yr (Sharpe 0.536) at beta -0.98; not a Stage 1 bar (D11)"
  - "269 of 276 months: smb / hml (harness FF3 rebuild) start June 1999, so signals before 1999-07-30 are NaN; the halves and the ls_n_months floor (242) run on the block's own 269 months; the 1998-12 preflight probe reads 0% coverage / 0 bins for the same reason"
  - "approx translation: harness-built FF3 daily factors (not Ken French's), rf omitted, SEP closeadj returns with carried no-trade rows counted, at least 15 days"
  - "near-duplicate of IdioVolAHT: same construct (residual daily volatility), same D1-driven shape, beta about -1, shared top years 2000 / 2021, annual IC of the same sign in 20 of 23 years (the other three |IC| <= 0.005); differs in window (one month vs 252 days) and turnover (64% vs 11%); overlap not measured at Stage 1"
  - "Cat.Economic volatility: no v0 seed family covers it; no Stage 2 number exists"
  - "delisting_adjusted_pct 0.44% is universe-wide (performance delistings 0.00%)"
