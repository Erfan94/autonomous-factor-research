character: >
  IC 0.0047 (NW t 1.49), gone in the second half (0.0102 then -0.0008); annual IC 2016-2020 all negative. Deciles are flat-to-humped (D1 1.023, D2 0.923, D4 1.152, D10 1.135 %/mo); raw spread 1.33%/yr (Sharpe 0.153, MaxDD -38.6%). Tier IC MEGA 0.0060, MID 0.0064, SMALL -0.0027. IC at lags 1-12 between 0.0001 and 0.0040; turnover 13.1% / 12.7%. Beta -0.11 (ex ante -0.07); hedged 2.81%/yr (Sharpe 0.319). its best LS years are 1999 (+32.4%), 2000 (+26.9%) and 2014 (+11.2%), outside which the annual hedged LS sums to -2.0 pp; ex-top-years Sharpe -0.018; bear -0.718 / bull 0.511.
caveats:
  - "coverage 46.2% passes the 40% bar, but the 1998-12 probe read 0.3% (6 names; 80-month lookback on a 1997-12 panel): the 1999-2000 cross-sections, its two best LS years, are thin, and avg_names_per_decile (91.2, a whole-window mean) cannot see it"
  - "Financial Services 6.6%, Real Estate 9.2%, Technology 36.9% coverage"
  - "275 IC months (one early month dropped); the tier table's ALL row (IC 0.0039, 274 months, bucket minimum 30 names) differs from the headline, consistent with the bucket minimum of 30 names"
  - "hedged above raw (2.81 vs 1.33%/yr) at beta -0.07 to -0.11: recorded as reported"
decision: >
  Rejected at Stage 1 on ic_tstat_nw (1.49 < 2.5); ic_mean (0.0047) and ic_half_min (-0.0008) also fail. Raw spread 1.33%/yr, coverage 46.2% >= 40, 91.2 names >= 30 and 275 LS months >= 247 pass, so it is not inconclusive under the pre-registered sample bars. The thin early years flatter rather than depress its numbers (1999 IC +0.058), so the rejection does not rest on them.
