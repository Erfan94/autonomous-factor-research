character: >
  The spread is a D1 effect: D1 0.665 %/mo, D2-D10 0.93-1.07; raw spread 3.89%/yr at vol 27.1% (Sharpe 0.144, MaxDD -72.4%). IC 0.0238 (NW t 2.63, ICIR 0.165), halves 0.0249 / 0.0226; tiers MEGA 0.0193, MID 0.0269, SMALL 0.0251 (raw LS Sharpe 0.059 / 0.238 / 0.189; MEGA raw MaxDD -90.1%). IC decays slowly (0.0230 h1, 0.0184 h6, 0.0189 h12); turnover 10.9% / 15.3%. Beta -1.07 (ex ante -1.04): the hedge adds 7.79 pp, 67% of the hedged 11.68%/yr (Sharpe 0.545, LS NW t 2.58). Ex-top-years Sharpe 0.389 (2000, 2014, 2021); bear -0.115 / bull 0.872; hedged LS -20.2% (1999), -27.9% (2009), -27.9% (2020), +70.3% (2000). Coverage 96.8%, 94.4-97.7% by sector.
caveats:
  - "the hedged headline is mostly hedge: raw 3.89%/yr (Sharpe 0.144) vs hedged 11.68%/yr (Sharpe 0.545) at beta -1.07; not a Stage 1 bar (D11)"
  - "272 of 276 months: market_daily starts 1998-12-02, so signals 1998-12 .. 1999-03 are NaN (100-pair minimum) and 1999-04 .. 1999-11 rest on 100-250 rows; the halves and the ls_n_months floor (244) run on the block's own 272 months; the 1998-12 preflight probe reads 0% coverage / 0 bins"
  - "approx translation: harness market_daily value-weighted series (not CRSP VW minus rf), rf omitted, SEP closeadj returns, 420-calendar-day reach"
  - "near-duplicate of IdioVol3F (see its row): same construct, shape, beta and top years; differs in window and turnover (11% vs 64%); overlap not measured at Stage 1"
  - "NW t 2.63 clears 2.5 by 0.13, the thinnest margin of the five passers"
  - "delisting_adjusted_pct 0.44% is universe-wide"
  - "Stage 2 (run 044, rung 2, vs v14): faced MaxRet and IdioVol3F in volatility; Stage 1 annual IC corr 0.978 IdioVol3F (20 / 23 same sign), 0.969 MaxRet (19 / 23), 0.949 zerotrade6M (19 / 23); residual IC 0.0073, 31% of its own 0.0238 (the ladder's highest share) on its own 272 months; spanning R2 0.40, corr 0.64; co-movement of annual IC, not a score correlation"
  - "NEAR MISS: resid t 1.923537 against the strict bar > 2.0, short by 0.076463; the closest Stage 2 rejection in the registry (next ShareIss1Y 1.88); the bar is the bar"
  - "Stage 2 diagnostics: dIC +0.0002 (t 0.71), spanning alpha -2.84%/yr (t -0.69), dSharpe -0.016, MaxDD 1.2 pts worse (-43.2 -> -44.5, the ladder's only worsening; raw -45.2 -> -47.5); WITH beta -0.585 vs -0.560 (ex ante -0.563 / -0.544), raw Sharpe 0.756 / 0.773, ex-top-years 0.630 / 0.650, bear 1.219 -> 1.214 / bull 1.115 -> 1.109; halves 0.0497 / 0.0287 vs 0.0498 / 0.0281; turnover D10 58.1 -> 55.8%"
  - "Stage 2: raw dLS +0.02 vs hedged +0.02 pp/yr (guard t 0.06), same sign; hedge part +0.002 at dbeta_mean -0.020"
decision: >
  Passes every Stage 1 bar: IC 0.0238 >= 0.010, NW t 2.63 >= 2.5, halves min 0.0226, raw spread 3.89%/yr > 0, coverage 96.8% >= 40, 192.9 names per decile, 272 LS months >= 244. Status stage2_pending; family to be assigned in Phase C. Higher mean IC than IdioVol3F (0.0238 vs 0.0229) at a lower t (2.63 vs 3.15; ICIR 0.165 vs 0.190) and about a sixth of the turnover. Stage 2 (run 044, rung 2, vs v14, 19 legs): REJECTED on resid_ic_tstat_nw 1.92, not > 2.0, short by 0.076 (residual IC 0.0073, 31% of its own 0.0238, 272 months); the guard passes (paired hedged dLS +0.02 pp/yr, t 0.06; raw +0.02). It would have been the third volatility leg at 0.0370. Diagnostics (never bars): dIC +0.0002 (t 0.71), spanning alpha -2.84%/yr (t -0.69), dSharpe -0.016 (0.983 -> 0.967), MaxDD 1.2 pts worse (-43.2 -> -44.5); WITH beta -0.585 vs -0.560, raw Sharpe 0.756 / 0.773, ex-top-years 0.630 / 0.650. In its family IdioVol3F was accepted at 2.03 and RealizedVol rejected at 1.73; facing IdioVol3F (annual IC corr 0.98) and MaxRet (0.97), the rules decide on the residual IC. The file stays in factors/candidates/.
