character: >
  Measured under dimension ARY (fiscal-year book over the December market value). Deciles rise smoothly (D1 0.842 to D10 1.149 %/mo) and the raw spread earns 3.68%/yr (Sharpe 0.311), but the rank IC is 0.0045 (NW t 0.82) and turns negative in the second half (0.0118 then -0.0028). MEGA IC -0.0018, SMALL 0.0061. IC at lags 1-12 flat at 0.004-0.005; turnover 8.9% / 6.8%. Beta near zero (-0.03 full window, -0.05 ex ante), yet the hedged series loses 3.1 pp/yr (0.61%/yr, Sharpe 0.054, MaxDD -64.0%), so the hedge's month-to-month beta timing costs return. Ex-top-years Sharpe -0.423 (2000, 2003, 2021).
caveats:
  - "dimension override ARY (not the project default ART)"
  - "hedged return 3.1 pp below raw at a mean beta near zero: the ex-ante hedge's timing, not its level"
  - "a value-family relative of v0 Value; the second-half IC is negative"
decision: >
  Rejected at Stage 1 on ic_tstat_nw (0.82 < 2.5); ic_mean (0.0045) and ic_half_min (-0.0028) also fail. Raw spread, coverage (92.1%), names (185.0) and months (270) pass. Not inconclusive. Same shape as AM in this batch: the value premium fades after 2010 on this snapshot.
