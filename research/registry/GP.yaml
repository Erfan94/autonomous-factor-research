decision: >
  Passes every Stage 1 bar: IC 0.0155 >= 0.010, NW t 3.52 >= 2.5, halves min 0.0105, raw spread 8.64%/yr > 0, coverage 74.4% >= 40, 146.2 names per decile, 276 LS months. Status stage2_pending; family to be assigned in Phase C. Second-highest NW t of the five passers (CBOperProf 3.74); lower IC than CBOperProf (0.0209) with a higher raw spread (8.64 vs 7.24%/yr) and ex-top-years Sharpe (0.921 vs 0.638). Against v0 (IC 0.0145, halves 0.0275 / 0.0016, ex-top-years Sharpe 0.159) its IC is less front-loaded. Stage 2 (run 023, rung 1, vs v5): PASS on both bars, residual IC 0.0073 with NW t 2.74 > 2.0 (47% of its own 0.0155) and guard paired hedged dLS +0.16 pp/yr, t 0.43 >= -2.0 (raw +0.35, approximate t 0.96 on the hedged paired SE). Joins profitability beside Profitability and CBOperProf at 0.0556 each. Diagnostics (never bars): dIC -0.0003 (t -0.79), spanning alpha 7.78%/yr (t 3.62), dSharpe +0.011 (0.914 -> 0.925), MaxDD 1.7 pts worse (-47.8 -> -49.4); WITH beta -0.323 vs -0.344 (ex ante -0.277 / -0.298), raw Sharpe 0.843 / 0.808, ex-top-years 0.490 / 0.479. Status stays stage2_pending until the coordinator applies it (v6 owed).
