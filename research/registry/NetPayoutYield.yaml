decision: >
  Passes every Stage 1 bar: IC 0.0145 >= 0.010, NW t 2.60 >= 2.5, halves min 0.0142, raw spread 4.92%/yr > 0, coverage 65.5% >= 40, 134.6 names per decile, 264 LS months >= 237. Status stage2_pending; family to be assigned in Phase C. Lowest NW t of the eight passers (IdioVolAHT 2.63); IC equals v0's 0.0145 at t 2.60 vs 2.62 with level halves; ex-top-years Sharpe 0.302 is second-lowest among the passers (CF -0.169). Stage 2 (run 044, rung 4, vs v14, 19 legs): REJECTED on resid_ic_tstat_nw 0.12, not > 2.0 (residual IC 0.0003, 2% of its own 0.0145, 264 months); the guard passes (paired hedged dLS +0.03 pp/yr, t 0.06; raw -0.43, approximate t -0.97). It would have been the third value leg at 0.0370. Diagnostics (never bars): dIC -0.0003 (t -0.56), spanning alpha -2.48%/yr (t -1.05), dSharpe -0.0004 (0.983 -> 0.982), MaxDD 0.3 pts better (-43.2 -> -42.9); WITH beta -0.593 vs -0.560, raw Sharpe 0.741 / 0.773, ex-top-years 0.674 / 0.650. The second value-family rejection after CF (1.02); the rules decide on the residual IC. The file stays in factors/candidates/.
