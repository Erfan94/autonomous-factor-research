character: >
  A D1 effect: D1 0.598 %/mo, D2-D3 0.84-0.89, D4-D10 1.02-1.19 (D10 1.135 below D7 1.193); raw spread 6.44%/yr (Sharpe 0.371, raw MaxDD -58.8%). IC 0.0192 (NW t 3.18, plain t 3.65, ICIR 0.220), halves 0.0263 / 0.0122; annual IC positive in 15 of 23 years (2000 +0.093, 2021 +0.094; 2020 -0.042). Tiers MEGA 0.0253, MID 0.0206, SMALL 0.0171 (raw LS Sharpe 0.294 / 0.558 / 0.240; MEGA raw MaxDD -87.0%). IC decays slowly (0.0173 h1, 0.0152 h6, 0.0135 h12); turnover 8.1% / 13.0%. Beta -0.60 (ex ante -0.51): the hedge adds 4.50 pp, 41% of the hedged 10.94%/yr (Sharpe 0.733, LS NW t 3.08, MaxDD -45.9%, hit 60.1%). 2000, 2002, 2021 carry 61% of the summed LS (2000 +120.2%, 2002 +33.6%, 2021 +35.9%; 2001 -12.6%, 2020 -24.7%); ex-top-years Sharpe 0.452; bear 0.476 / bull 0.884. Coverage 70.7%: Real Estate 2.0%, Financial Services 3.3%, Utilities 26.4%, Healthcare 75.5%, the rest 86-96%.
caveats:
  - "the hedged headline is 41% hedge: raw 6.44%/yr (Sharpe 0.371) vs hedged 10.94%/yr (Sharpe 0.733) at beta -0.60; not a Stage 1 bar (D11)"
  - "likely overlap with CBOperProf (b1): annual IC correlation 0.97, same sign in 22 / 23 years, the same top years 2000 / 2002 / 2021 (CBOperProf 2000 hedged +92.5%); with GP (b4) 0.85, 19 / 23; co-movement of annual IC, not a score correlation; no Stage 2 number exists"
  - "shares the revenue - cor - sgna core with the v0 Profitability leg (v0 also subtracts rnd and intexp and divides by equity, with no zero gates or financials screen); v0 Profitability has no standalone series on this snapshot to correlate"
  - "one year carries much of the return: 2000 hedged +120.2%"
  - "financials by CURRENT SIC 6000-6999 (look-ahead, current_sic_signal_values); Utilities 26.4% and Healthcare 75.5% coverage sit under the sgna == 0 / cor == 0 -> NaN gates (vendor zero-fills), not decomposed here"
  - "cor and sgna embed D&A for some filers (numerator lower; rank rho 0.95-0.97 against a corrected form per the file); latest ART filing, no 6-month annual lag"
  - "Cat.Economic profitability: the v0 profitability seed family's category"
  - "delisting_adjusted_pct 0.44% is universe-wide (performance delistings 0.00%)"
  - "Stage 2 (run 032, rung 1, vs v9): faced five profitability legs; Stage 1 annual IC correlation 0.97 with CBOperProf (22 / 23 same sign), 0.93 RoE, 0.91 roaq, 0.85 GP (v0 Profitability has no standalone series); residual IC -0.0011 (share -0.055), the first negative residual of the ladders"
  - "Stage 2 diagnostics lean the other way from the bar: spanning alpha +2.66%/yr (t 0.86, R2 0.35, corr 0.60), dSharpe +0.013, MaxDD 0.2 pts better; raw dLS +0.19 vs hedged +0.17 pp/yr (approx raw t 1.03), hedge part -0.02 at dbeta_mean +0.003; dIC -0.00002 (t -0.20)"
  - "Stage 2: leg_coverage_pct_full 45.4 -> 42.9 (its 70.7% coverage); would have been the sixth profitability leg at 0.0238 (1/42)"
decision: >
  Passes every Stage 1 bar: IC 0.0192 >= 0.010, NW t 3.18 >= 2.5, halves min 0.0122, raw spread 6.44%/yr > 0, coverage 70.7% >= 40, 139.0 names per decile, 276 LS months >= 248. Status stage2_pending; family to be assigned in Phase C. Fifth NW t of the 11 passers (PctAcc 4.03, CBOperProf 3.74, GP 3.52, MaxRet 3.42); against CBOperProf, the closest prior row, IC 0.0192 vs 0.0209 and ex-top-years Sharpe 0.452 vs 0.638. Stage 2 (run 032, rung 1, vs v9): REJECTED on resid_ic_tstat_nw -0.42, not > 2.0 (residual IC -0.0011, -5% of its own 0.0192); the guard passes (paired hedged dLS +0.17 pp/yr, t 0.92; raw +0.19, approximate t 1.03). Diagnostics (never bars): dIC -0.00002 (t -0.20), spanning alpha 2.66%/yr (t 0.86, R2 0.35, corr 0.60), dSharpe +0.013 (0.932 -> 0.944), MaxDD 0.2 pts better (-43.7 -> -43.4); WITH beta -0.735 vs -0.734 (ex ante -0.660 / -0.663), raw Sharpe 0.590 / 0.579, ex-top-years 0.595 / 0.581. Facing CBOperProf (annual IC corr 0.97) and four other profitability legs, the expected consequence of the declared order; the rules decide on the residual IC. The file stays in factors/candidates/, and the leg is absent from the bases of rungs 2-5.
