character: >
  Scorable from 2004 only on this snapshot (208 months; zero coverage at the 1998-12 probe). IC 0.0092 (NW t 2.28), stable across halves (0.0102 / 0.0081). The deciles are flat from D1 to D9 (1.006-1.132 %/mo) and D10 jumps to 1.287, so the raw spread (2.51%/yr, Sharpe 0.296) is a D10 tail. MID carries it (IC 0.0129) over MEGA and SMALL (0.0068 / 0.0067). IC peaks at lag 3 (0.0090) and fades to 0.0012 by lag 12: a drift that lasts about a quarter. Turnover 36.3% / 36.2%, the highest in the batch. Beta -0.21 (full window), so the hedge adds return: hedged 5.19%/yr, Sharpe 0.643. Bear -0.988 / bull 1.130; ex-top-years Sharpe 0.343.
caveats:
  - "208-month window (2004-2021); the LS-month floor scales to 187 and is met"
  - "hedged Sharpe 0.643 against raw 0.296 comes from a negative beta, not from the signal"
  - "the tier table's ALL row counts 207 LS months against the block's 208 (bucket minimum of 50 names in the first month): diagnostic only"
decision: >
  Rejected at Stage 1 on ic_tstat_nw (2.28 < 2.5); ic_mean also fails (0.0092 < 0.010). The closest miss in the batch, but on a 208-month sample. Halves, raw spread, coverage (66.5%), names (173.5) and months pass. Not inconclusive: 208 months clear both the 120-month minimum and the 187 floor.
