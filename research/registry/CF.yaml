character: >
  The spread is a top-decile effect: D9/D10 earn 1.238/1.220 %/mo against a 0.799-0.967 middle, and D1 (0.944) beats D2-D5, so the short leg does not grade. IC 0.0201 (NW t 3.03), but the raw D10-D1 is 3.32%/yr at 16.5% vol (Sharpe 0.201, MaxDD -59.8%) and the hedged LS NW t is 0.75: the spread is not distinguishable from zero. Halves 0.0331 then 0.0070; 2000-2002 ICs are 0.085-0.095 and the 2011-2020 annual ICs average -0.0006, the second half resting on 2021 (+0.089). Tiers are uniform (IC MEGA 0.0178, MID 0.0157, SMALL 0.0223; raw LS Sharpe 0.157 / 0.284 / 0.189). IC is flat at lags 1-12 (0.0155 to 0.0155); turnover 17.0% / 16.4%. Beta -0.29 (ex ante -0.28), yet the hedged series earns 2.75%/yr (Sharpe 0.179), below raw. outside 2000-2002 the annual hedged LS sums to -29 pp (2020 -35.6%, 1999 -23.3%); ex-top-years Sharpe -0.169; bear 0.518 / bull 0.176. Coverage 96.1%, sector-uniform (92.7-97.7%); performance delistings 0.00%, merger 0.43%, universe-wide.
caveats:
  - "the spread rests on 2000-2002 (outside them the annual hedged LS sums to -29 pp; ex-top-years Sharpe -0.169); the 2011-2020 annual ICs average about zero and the second half (0.0070) is carried by 2021 (+0.089)"
  - "IC NW t 3.03 but LS NW t 0.75, raw MaxDD -59.8% (MEGA bucket raw MaxDD -78.1%): the information is in the rank, not in a decile spread distinguishable from zero"
  - "hedged below raw (2.75 vs 3.32%/yr) at a negative beta (-0.29): recorded as reported; a fact for the open hedge_gap_check_before_phase_d"
  - "SignalDoc Cat.Economic valuation: (ib + dp) / ME is a price-scaled cash-earnings ratio, nearest v0 Value (B/M) by category and sharing the cash-earnings concept with CBOperProf; overlap is a Stage 2 question and no Stage 2 number exists"
  - "approx translation: TTM to the latest filed quarter vs OSAP's fiscal-year figure with a 6-month lag; ib = netinc + netincdis; dp = depamor (incl. ROU amortisation from 2019); NASDAQ included against SignalDoc's exchcd (1,2) filter; fxusd != 1 nulled"
  - "coverage 57.2% at the 1998-12 probe (ART TTM gap), about 92% from 1999-03 per the translation"
  - "delisting_adjusted_pct 0.44% is the universe-wide forward-return mix, identical on all 12 blocks, not this factor's short leg"
  - "Stage 2 (run 032, rung 4, vs v9 + IdioVol3F): faced Value and cfp; Stage 1 annual IC correlation 0.96 with cfp (21 / 23 same sign); residual IC 0.0023, 11% of its own 0.0201"
  - "Stage 2: spanning alpha -7.61%/yr, NW t -2.70 (R2 0.54, corr 0.73), the first significantly negative spanning alpha of the ladders; dSharpe -0.058, bear Sharpe 0.842 -> 0.666, raw Sharpe 0.578 -> 0.524, ex-top-years 0.575 -> 0.519; diagnostics, never bars"
  - "Stage 2: raw dLS -0.67 vs hedged -0.40 pp/yr (approx raw t -1.30, guard t -0.76); hedge part +0.28 at dbeta_mean -0.032 (implied universe mean about 8.8%/yr)"
decision: >
  Passes every Stage 1 bar: IC 0.0201 >= 0.010, NW t 3.03 >= 2.5, both halves positive (min 0.0070), raw spread 3.32%/yr > 0, coverage 96.1% >= 40, 188.7 names per decile, 276 LS months. Status stage2_pending; family to be assigned in Phase C. The second Stage 1 passer after CBOperProf (IC 0.0209, t 3.74, raw 7.24%/yr), weaker on t and on the spread. Standalone IC is above the v0 blend's 0.0145 / t 2.62, with the same front-loaded shape (v0 halves 0.0275 / 0.0016, top years 2000/2001/2003). The residual bar at Stage 2, not this screen, decides. Stage 2 (run 032, rung 4, vs v9 + IdioVol3F): REJECTED on resid_ic_tstat_nw 1.02, not > 2.0 (residual IC 0.0023, 11% of its own 0.0201); the guard passes (paired hedged dLS -0.40 pp/yr, t -0.76; raw -0.67, approximate t -1.30). It would have been the third value leg at 0.0476. Diagnostics (never bars): dIC +0.0003 (t 0.72), spanning alpha -7.61%/yr (t -2.70), dSharpe -0.058 (0.919 -> 0.861), MaxDD 0.9 pts better (-45.8 -> -44.9); WITH beta -0.791 vs -0.752 (ex ante -0.712 / -0.680), raw Sharpe 0.524 / 0.578, ex-top-years 0.519 / 0.575. Facing cfp (annual IC corr 0.96), the expected consequence of the declared order; the rules decide on the residual IC. The file stays in factors/candidates/, and the leg is absent from the base of rung 5.
